[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x-migrate"
version = "0.1.0"
description = "Migrate X (Twitter) lists between accounts"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "typer>=0.9",
    "rich>=13",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
x-migrate = "x_migrate.cli:app"
xm = "x_migrate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/x_migrate"]
